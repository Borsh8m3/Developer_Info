<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Nieruchomości Pro 2026</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar">
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('calc')">Kalkulator</button>
        <button class="tab-btn" onclick="openTab('history-tab')">Historia</button>
    </div>

    <div id="calc" class="tab-content active">
        <h2>⚙️ Parametry</h2>
        
        <div class="input-group">
            <label>Powierzchnia: <span id="areaVal">50</span> m²</label>
            <input type="range" id="area" min="15" max="250" value="50" oninput="updateRange(this.value)">
        </div>

        <div class="input-group">
            <label>Rynek</label>
            <select id="market">
                <option value="1.1">Pierwotny (+10%)</option>
                <option value="1.0">Wtórny</option>
            </select>
        </div>

        <div class="input-group">
            <label>Rodzaj budynku</label>
            <select id="buildingType">
                <option value="1.0">Wielorodzinny (Blok)</option>
                <option value="1.2">Jednorodzinny</option>
                <option value="0.9">Inny</option>
            </select>
        </div>

        <div class="input-group">
            <label>Prawo do nieruchomości</label>
            <select id="legalStatus">
                <option value="1.0">Własność</option>
                <option value="0.85">Użytkowanie wieczyste</option>
            </select>
        </div>

        <button class="primary-btn" onclick="calculatePrice()">🚀 Oblicz wartość</button>

        <div id="result" class="result-box" style="display:none;">
            <small>Szacowana cena:</small>
            <h3 id="priceDisplay">0 PLN</h3>
        </div>
    </div>

    <div id="history-tab" class="tab-content">
        <h2>🕒 Ostatnie wyceny</h2>
        <div id="historyList"></div>
        <button class="secondary-btn" onclick="clearHistory()">Wyczyść historię</button>
    </div>
</div>

<div id="map-container">
    <div id="map"></div>
    <div class="map-legend">
        🔥 Heatmapa: Ceny rynkowe 2026
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
<script src="script.js"></script>
</body>
</html>
